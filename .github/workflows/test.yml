name: "build-test"
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'
      - 'deps/**'
  schedule:
    - cron: '0 9 * * *'

jobs:
  unit: # make sure build/ci work properly
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    - run: npm run all
    - run: git diff --exit-code -- dist

  integration: # make sure the action works on a clean machine without building
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: core20
            snapcraft-channel: 8.x/stable
          - project: core22
            snapcraft-channel: stable
          - project: core24
            snapcraft-channel: stable
          - project: core26
            snapcraft-channel: stable
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./
      id: snapcraft
      with:
        path: './test-projects/${{ matrix.project }}'
        snapcraft-channel: ${{ matrix.snapcraft-channel }}
        snapcraft-args: pack
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: 'snap-${{ matrix.project }}'
        path: ${{ steps.snapcraft.outputs.snap}}
        compression-level: 0
        retention-days: 7

  collect-artifacts:
    needs:
      - integration
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/upload-artifact/merge@v7.0.2
      with:
        name: snap
        pattern: snap-*
        delete-merged: true
        retention-days: 7

  check-runner: # make sure the action works on each VM image
    strategy:
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-26.04
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: ./
      with:
        path: './test-projects/core22'
        snapcraft-args: pack
